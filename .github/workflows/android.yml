name: Android build & release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      # Optional: set these repo secrets to sign with your own key instead of the bundled CI key.
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Use private signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          # Pasted secrets often pick up spaces, line breaks or the trailing "%" macOS
          # Terminal shows after output; keep only base64 characters. A wrong key still
          # fails loudly when Gradle checks the keystore password.
          clean=$(printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')
          if printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null && [ -s "$RUNNER_TEMP/release.jks" ]; then
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing key decoded ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes)."
          else
            msg="SIGNING_KEYSTORE_BASE64 is not valid base64 (${#clean} usable characters). Re-copy it with: base64 -i release.p12 | pbcopy"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::$msg"; exit 1
            fi
            echo "::warning::$msg Branch build continues with the debug key."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LittleSquares-v${VERSION_NAME}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: LittleSquares-v${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Little Squares v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Little Squares v${{ env.VERSION_NAME }} — built from ${{ github.sha }}.

            Download the APK below and open it on your Android phone (Android 8.0+) to install.
